#:schema https://json.schemastore.org/any.json

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./tmp/main"
cmd = "go build -o ./tmp/main ./cmd/web && templ generate --notify-proxy"
delay = 100
#exclude_dir = ["assets", "tmp", "vendor", "testdata", "player-files", "attendance-files", "node_modules"]
exclude_dir = []
exclude_file = ["cmd/web/tailwind.css"]
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
#include_dir = ["./cmd/web"]
include_dir = ["cmd"]
#include_ext = ["go", "templ", "tmpl", "html", "css"]
# Air rebuilds binary on CSS changes, as static assets are embedded with go:embed
include_ext = ["go", "css"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = true

[proxy]
app_port = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
